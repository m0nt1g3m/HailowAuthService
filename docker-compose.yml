networks:
  hailow-network:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    container_name: hailow-postgres
    ports:
     - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - hailow-network

  redis:
    image: redis:7-alpine
    container_name: hailow-redis
    ports:
      - "6379:6379"
    networks:
      - hailow-network

  app:
    container_name: hailow-auth-service
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "50001:50001"
    networks:
      - hailow-network

volumes:
  postgres_data:
